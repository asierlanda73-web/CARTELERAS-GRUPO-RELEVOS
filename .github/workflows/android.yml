name: Generar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar aplicacion
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generar proyecto Android
        run: |
          mkdir android-app
          cd android-app
          bubblewrap init --manifest https://asierlanda73-web.github.io/CARTELERAS-GRUPO-RELEVOS/manifest.json
